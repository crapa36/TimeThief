name: Diagnose smoke light boundary

on:
  pull_request:
    branches: [SmokeOptimization]
    paths: [.github/triggers/finalize-smoke-light-boundary.txt]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: SmokeOptimization
          fetch-depth: 1
      - name: Count patch targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          out = []
          light = Path('Plugins/TimeThiefSmokeRenderer/Shaders/TimeThiefSmokeBuildLightVolume.usf').read_text()
          out.append(f"light_parameters={light.count('float3 BoundsExtent;' + chr(10) + 'float3 LightDirection;')}")
          out.append(f"light_uvw={light.count('const float3 UVW = SampleLocal / max(BoundsExtent, 1.0.xxx) * 0.5 + 0.5;')}")
          out.append(f"light_accum={light.count('OpticalDepth += max(ExtinctionTexture.SampleLevel(VolumeSampler, UVW, 0.0), 0.0) * LightDistanceScale * IntervalLength;')}")
          header = Path('Plugins/TimeThiefSmokeRenderer/Source/TimeThiefSmokeRenderer/Private/TimeThiefSmokeShaders.h').read_text()
          a = header.index('class FTimeThiefSmokeBuildLightVolumeCS')
          b = header.index('class FTimeThiefSmokeBuildActiveBrickListCS', a)
          block = header[a:b]
          out.append(f"header_parameters={block.count('SHADER_PARAMETER(FVector3f, BoundsExtent)' + chr(10) + chr(9) + chr(9) + 'SHADER_PARAMETER(FVector3f, LightDirection)')}")
          cpp = Path('Plugins/TimeThiefSmokeRenderer/Source/TimeThiefSmokeRenderer/Private/TimeThiefSmokeViewExtension.cpp').read_text()
          a = cpp.index('void FTimeThiefSmokeViewExtension::AddBuildLightVolumePass(')
          b = cpp.index('void FTimeThiefSmokeViewExtension::AddBuildMacDivergencePass(', a)
          block = cpp[a:b]
          out.append(f"cpp_parameters={block.count('PassParameters->BoundsExtent = State.Volume.BoundsExtent;' + chr(10) + chr(9) + 'PassParameters->LightDirection')}")
          Path('/tmp/light-boundary-diagnostic.txt').write_text('\n'.join(out) + '\n')
          print('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: light-boundary-diagnostic
          path: /tmp/light-boundary-diagnostic.txt
