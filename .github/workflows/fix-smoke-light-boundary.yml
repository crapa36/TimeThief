name: Preserve smoke light boundary

on:
  pull_request:
    branches:
      - SmokeOptimization
    paths:
      - .github/triggers/fix-smoke-light-boundary.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: SmokeOptimization
          fetch-depth: 0
      - name: Apply analytic boundary to light volume
        shell: bash
        run: |
          set -euo pipefail
          LIGHT=Plugins/TimeThiefSmokeRenderer/Shaders/TimeThiefSmokeBuildLightVolume.usf
          HEADER=Plugins/TimeThiefSmokeRenderer/Source/TimeThiefSmokeRenderer/Private/TimeThiefSmokeShaders.h
          CPP=Plugins/TimeThiefSmokeRenderer/Source/TimeThiefSmokeRenderer/Private/TimeThiefSmokeViewExtension.cpp

          python3 - <<'PY'
          from pathlib import Path

          light = Path("Plugins/TimeThiefSmokeRenderer/Shaders/TimeThiefSmokeBuildLightVolume.usf")
          text = light.read_text()
          old = """int3 GridResolution;\nfloat3 BoundsExtent;\nfloat3 LightDirection;\n"""
          new = """int3 GridResolution;\nfloat3 BoundsExtent;\nfloat3 NaturalBoundsExtent;\nfloat3 LightDirection;\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = """\t\t\tconst float3 SampleLocal = LocalPosition + LocalLightDirection * Distance;\n\t\t\tconst float3 UVW = SampleLocal / max(BoundsExtent, 1.0.xxx) * 0.5 + 0.5;\n\t\t\tif (TimeThiefSmokeInsideUVW(UVW))\n\t\t\t{\n\t\t\t\tOpticalDepth += max(ExtinctionTexture.SampleLevel(VolumeSampler, UVW, 0.0), 0.0) * LightDistanceScale * IntervalLength;\n\t\t\t}\n"""
          new = """\t\t\tconst float3 SampleLocal = LocalPosition + LocalLightDirection * Distance;\n\t\t\tconst float3 SampleSimulationLocal = SampleLocal / max(BoundsExtent, 1.0.xxx);\n\t\t\tconst float3 UVW = SampleSimulationLocal * 0.5 + 0.5;\n\t\t\tif (TimeThiefSmokeInsideUVW(UVW))\n\t\t\t{\n\t\t\t\t// The shared extinction volume no longer contains the render silhouette. Keep\n\t\t\t\t// the light field bounded by the same continuous ellipsoid used for rendering.\n\t\t\t\tconst float BoundaryMask = TimeThiefSmokeRenderBoundaryMask(\n\t\t\t\t\tSampleSimulationLocal,\n\t\t\t\t\tBoundsExtent,\n\t\t\t\t\tNaturalBoundsExtent,\n\t\t\t\t\t0.0);\n\t\t\t\tOpticalDepth += max(ExtinctionTexture.SampleLevel(VolumeSampler, UVW, 0.0), 0.0) * BoundaryMask * LightDistanceScale * IntervalLength;\n\t\t\t}\n"""
          assert text.count(old) == 1
          light.write_text(text.replace(old, new, 1))

          header = Path("Plugins/TimeThiefSmokeRenderer/Source/TimeThiefSmokeRenderer/Private/TimeThiefSmokeShaders.h")
          text = header.read_text()
          class_start = text.index("class FTimeThiefSmokeBuildLightVolumeCS")
          class_end = text.index("\n};", class_start) + 4
          block = text[class_start:class_end]
          old = """\t\tSHADER_PARAMETER(FIntVector, GridResolution)\n\t\tSHADER_PARAMETER(FVector3f, BoundsExtent)\n\t\tSHADER_PARAMETER(FVector3f, LightDirection)\n"""
          new = """\t\tSHADER_PARAMETER(FIntVector, GridResolution)\n\t\tSHADER_PARAMETER(FVector3f, BoundsExtent)\n\t\tSHADER_PARAMETER(FVector3f, NaturalBoundsExtent)\n\t\tSHADER_PARAMETER(FVector3f, LightDirection)\n"""
          assert block.count(old) == 1
          text = text[:class_start] + block.replace(old, new, 1) + text[class_end:]
          header.write_text(text)

          cpp = Path("Plugins/TimeThiefSmokeRenderer/Source/TimeThiefSmokeRenderer/Private/TimeThiefSmokeViewExtension.cpp")
          text = cpp.read_text()
          function_start = text.index("void FTimeThiefSmokeViewExtension::AddBuildLightVolumePass(")
          function_end = text.index("\n}\n", function_start) + 3
          block = text[function_start:function_end]
          old = "\tPassParameters->BoundsExtent = State.Volume.BoundsExtent;\n"
          new = old + "\tPassParameters->NaturalBoundsExtent = State.Volume.NaturalBoundsExtent;\n"
          assert block.count(old) == 1
          text = text[:function_start] + block.replace(old, new, 1) + text[function_end:]
          cpp.write_text(text)
          PY

          grep -q '^float3 NaturalBoundsExtent;$' "$LIGHT"
          grep -q 'const float BoundaryMask = TimeThiefSmokeRenderBoundaryMask(' "$LIGHT"
          grep -q 'SHADER_PARAMETER(FVector3f, NaturalBoundsExtent)' "$HEADER"
          grep -q 'PassParameters->NaturalBoundsExtent = State.Volume.NaturalBoundsExtent;' "$CPP"
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --check

          export GIT_AUTHOR_NAME='crapa36'
          export GIT_AUTHOR_EMAIL='50472938+crapa36@users.noreply.github.com'
          export GIT_COMMITTER_NAME='crapa36'
          export GIT_COMMITTER_EMAIL='50472938+crapa36@users.noreply.github.com'
          git add "$LIGHT" "$HEADER" "$CPP"
          git commit -m 'Preserve smoke boundary in light volume'
          git push origin HEAD:SmokeOptimization
