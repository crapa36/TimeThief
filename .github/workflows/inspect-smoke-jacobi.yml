name: Inspect smoke Jacobi cleanup

on:
  pull_request:
    branches:
      - SmokeOptimization

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup in validation workspace
        run: python3 .github/scripts/apply_smoke_jacobi_cleanup.py
      - name: Validate and capture diff
        shell: bash
        run: |
          git diff --check
          git status --short > cleanup-status.txt
          git diff --binary > cleanup.patch
          git diff --stat > cleanup-stat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-jacobi-cleanup-preview
          path: |
            cleanup-status.txt
            cleanup-stat.txt
            cleanup.patch
          if-no-files-found: error