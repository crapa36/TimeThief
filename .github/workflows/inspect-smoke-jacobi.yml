name: Inspect smoke Jacobi cleanup

on:
  pull_request:
    branches:
      - SmokeOptimization

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-smoke-jacobi
          fetch-depth: 0
      - name: Apply cleanup when needed
        shell: bash
        run: |
          if [ -f Plugins/TimeThiefSmokeRenderer/Shaders/TimeThiefSmokePressureMGPCG.usf ]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_smoke_jacobi_cleanup.py')
          text = path.read_text()
          old = '''    end = text.find("\\n\\t);", pos)\n    if end < 0:\n        raise RuntimeError(f"Missing console variable terminator: {variable_name}")\n    end += len("\\n\\t);")\n'''
          new = '''    end = text.find("));", pos)\n    if end < 0:\n        raise RuntimeError(f"Missing console variable terminator: {variable_name}")\n    end += len("));")\n'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected remove_console_variable implementation')
          path.write_text(text.replace(old, new))
          PY
            python3 .github/scripts/apply_smoke_jacobi_cleanup.py
            git diff --check
            git config user.name "OpenAI"
            git config user.email "noreply@openai.com"
            git add -A Plugins/TimeThiefSmokeRenderer Plugins/TimeThiefSmokeTest
            git commit -m "Restore Jacobi-only smoke projection"
            git push origin HEAD:agent/restore-smoke-jacobi
          else
            ! grep -R -n -E 'MGPCG|PressureSolver|AdaptiveFluid|VelocityMaximum|VelocityMax|QualityCourantLimit|MaxAdaptiveFluidSubsteps|VelocityReadbackIntervalFrames|LastMeasuredMaxVelocity|AddMGPCGPressureSolvePasses' \
              Plugins/TimeThiefSmokeRenderer Plugins/TimeThiefSmokeTest \
              --include='*.h' --include='*.cpp' --include='*.ush' --include='*.usf'
            git diff --check
          fi