name: Inspect smoke Jacobi cleanup

on:
  pull_request:
    branches:
      - SmokeOptimization

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup in validation workspace
        id: cleanup
        continue-on-error: true
        shell: bash
        run: |
          python3 .github/scripts/apply_smoke_jacobi_cleanup.py > cleanup-run.txt 2>&1
      - name: Capture generated diff
        if: always()
        shell: bash
        run: |
          git status --short > cleanup-status.txt
          git diff --stat > cleanup-stat.txt
          git diff --binary > cleanup.patch
          git diff --check >> cleanup-run.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-jacobi-cleanup-preview
          path: |
            cleanup-run.txt
            cleanup-status.txt
            cleanup-stat.txt
            cleanup.patch
          if-no-files-found: error
      - name: Fail if cleanup failed
        if: steps.cleanup.outcome != 'success'
        run: exit 1