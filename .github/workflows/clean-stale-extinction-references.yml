name: Clean stale extinction references

on:
  pull_request:
    branches: [SmokeOptimization]
    paths: [.github/triggers/clean-stale-extinction-references.txt]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: SmokeOptimization
          fetch-depth: 0
      - name: Remove stale state references
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD=4cebd17248dbff33edcab529a1c3d7c64bddb59c
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Plugins/TimeThiefSmokeRenderer/Source/TimeThiefSmokeRenderer/Private/TimeThiefSmokeViewExtension.cpp')
          text = path.read_text()
          old = '''\t\t\tState.RenderOccupancyTexture.SafeRelease();\n\t\t\tState.ExtinctionTextures[0].SafeRelease();\n\t\t\tState.ExtinctionTextures[1].SafeRelease();\n\t\t\tState.LightOpticalDepthTextures[0].SafeRelease();\n'''
          new = '''\t\t\tState.RenderOccupancyTexture.SafeRelease();\n\t\t\tState.LightOpticalDepthTextures[0].SafeRelease();\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old = '''\t\t\tState.BrickOccupancyTexture.IsValid() &&\n\t\t\tState.PackedDenseFieldTextures[State.CurrentPackedFieldIndex].IsValid() &&\n\t\t\tState.ExtinctionTextures[State.CurrentPackedFieldIndex].IsValid())\n'''
          new = '''\t\t\tState.BrickOccupancyTexture.IsValid() &&\n\t\t\tState.PackedDenseFieldTextures[State.CurrentPackedFieldIndex].IsValid())\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY
          ! git grep -n -E 'FTimeThiefSmokeBuildExtinctionVolumeCS|AddBuildExtinctionVolumePass|ExtinctionTextures|ExtinctionTexture[0-9]|PreviousExtinctionTexture|TimeThiefSmokeExtinction' -- Plugins/TimeThiefSmokeRenderer
          git diff --check
          export GIT_AUTHOR_NAME='crapa36'
          export GIT_AUTHOR_EMAIL='50472938+crapa36@users.noreply.github.com'
          export GIT_COMMITTER_NAME='crapa36'
          export GIT_COMMITTER_EMAIL='50472938+crapa36@users.noreply.github.com'
          git add Plugins/TimeThiefSmokeRenderer/Source/TimeThiefSmokeRenderer/Private/TimeThiefSmokeViewExtension.cpp
          git commit -m 'Remove stale extinction texture references'
          git push origin HEAD:SmokeOptimization
